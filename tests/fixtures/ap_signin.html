<!-- Trimmed from a real www.amazon.com/ap/signin response, session tokens scrubbed -->
<html>
  <body>
    <form
      action="https://www.amazon.com/ap/register/000-0000000-0000000"
      class="ap_ango_default fwcim-form auth-validate-form auth-clearable-form"
      data-enable-mobile-account-js="true"
      id="ap_register_form"
      method="post"
      name="register"
      novalidate=""
    >
      <input name="appActionToken" type="hidden" value="APP_ACTION_TOKEN" />
      <input name="appAction" type="hidden" value="REGISTER" />
      <input name="shouldShowPersistentLabels" type="hidden" value="true" />
      <input
        name="openid.return_to"
        type="hidden"
        value="ape:aHR0cHM6Ly93d3cuYW1hem9uLmNvbS9hcC9tYXBsYW5kaW5n"
      />
      <input
        name="prevRID"
        type="hidden"
        value="ape:UFJFVklPVVNfUkVRVUVTVF9JRA=="
      />
      <input name="workflowState" type="hidden" value="WORKFLOW_STATE" />
      <input name="anti-csrftoken-a2z" type="hidden" value="ANTI_CSRF_TOKEN" />
      <input
        aria-describedby="nameAlert"
        aria-label="First and last name"
        aria-required="true"
        autocomplete="name"
        id="ap_customer_name"
        maxlength="50"
        name="customerName"
        spellcheck="false"
        type="text"
      />
      <input
        aria-describedby="emailPhoneNumberAlert"
        aria-label="Your email address"
        aria-required="true"
        autocapitalize="off"
        autocomplete="email"
        autocorrect="off"
        id="ap_email"
        maxlength="64"
        name="email"
        spellcheck="false"
        type="email"
      />
      <input
        aria-describedby="ap_password_context_message_section passwordAlert"
        aria-label="Create a password"
        aria-required="true"
        autocapitalize="off"
        autocorrect="off"
        id="ap_password"
        maxlength="1024"
        name="password"
        spellcheck="false"
        type="password"
      />
      <input
        id="ap_show_password_checked"
        name="showPasswordChecked"
        type="hidden"
        value="false"
      />
      <input
        id="auth-register-show-password-checkbox"
        name=""
        type="checkbox"
        value=""
      />
      <input
        aria-describedby="legalTextRow"
        aria-labelledby="auth-continue-announce"
        class="a-button-input"
        id="continue"
        type="submit"
      />
      <input
        aria-labelledby="auth-create-account-button-announce"
        class="a-button-input"
        id="continue"
        type="submit"
      />
    </form>
    <form
      action="https://www.amazon.com/ap/signin/000-0000000-0000000"
      class="auth-validate-form fwcim-form auth-clearable-form"
      id="ap_login_form"
      method="post"
      name="signIn"
      novalidate=""
    >
      <input name="appActionToken" type="hidden" value="APP_ACTION_TOKEN" />
      <input name="appAction" type="hidden" value="SIGNIN_PWD_COLLECT" />
      <input
        name="openid.return_to"
        type="hidden"
        value="ape:aHR0cHM6Ly93d3cuYW1hem9uLmNvbS9hcC9tYXBsYW5kaW5n"
      />
      <input
        name="prevRID"
        type="hidden"
        value="ape:UFJFVklPVVNfUkVRVUVTVF9JRA=="
      />
      <input name="workflowState" type="hidden" value="WORKFLOW_STATE" />
      <input name="anti-csrftoken-a2z" type="hidden" value="ANTI_CSRF_TOKEN" />
      <input name="useRecyclingRule" type="hidden" value="false" />
      <input name="subPageType" type="hidden" value="SignInClaimCollect" />
      <input name="shouldShowPersistentLabels" type="hidden" value="true" />
      <input
        aria-label="Enter mobile number or email"
        aria-required="true"
        autocapitalize="off"
        autocomplete="username"
        autocorrect="off"
        id="ap_email_login"
        maxlength="128"
        name="email"
        spellcheck="false"
        type="email"
      />
      <input
        autocomplete="current-password"
        id="ap-credential-autofill-hint"
        maxlength="1024"
        name="password"
        spellcheck="false"
        type="password"
      />
      <input
        aria-labelledby="continue-announce"
        class="a-button-input"
        id="continue"
        type="submit"
      />
    </form>
  </body>
</html>
